<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reels & Chat</title>
<style>
:root{--bg:#fafafa;--fg:#111;--card:#fff;--mut:#777;--ac:#e1306c;--me:#e1306c;--bd:#e5e5e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--fg:#f2f2f2;--card:#1a1a1a;--mut:#999;--bd:#2a2a2a}}
:root[data-theme="dark"]{--bg:#0b0b0b;--fg:#f2f2f2;--card:#1a1a1a;--mut:#999;--bd:#2a2a2a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0;background:linear-gradient(45deg,#f09433,#e1306c,#833ab4);-webkit-background-clip:text;color:transparent}
#who{font-size:13px;color:var(--mut);cursor:pointer}
main{flex:1;min-height:0;position:relative}
section{position:absolute;inset:0;display:none}section.on{display:flex;flex-direction:column}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.reel video{width:100%;height:100%;object-fit:contain}
.cap{position:absolute;left:12px;right:70px;bottom:14px;color:#fff;text-shadow:0 1px 4px #000;font-size:14px}
.cap b{display:block;margin-bottom:2px}
.side{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:14px;align-items:center;color:#fff}
.side button{background:rgba(0,0,0,.4);border:0;color:#fff;border-radius:50%;width:46px;height:46px;font-size:22px}
.side span{font-size:12px;margin-top:-10px}
.empty{margin:auto;text-align:center;color:var(--mut);padding:30px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;padding:12px;border:0;background:none;color:var(--mut);font-size:15px}
nav button.on{color:var(--ac);font-weight:700}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--bd);word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-color:var(--me)}
.m small{display:block;font-size:11px;opacity:.7}
form,.bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd);background:var(--card)}
input[type=text]{flex:1;padding:10px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:16px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:10px 16px;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--card);flex:none}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:16px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}#sheet.on{display:flex}
.sh{background:var(--card);width:100%;height:70%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.shh{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd)}
.shh button{background:none;border:0;color:var(--fg);font-size:18px}
#cl{flex:1;overflow-y:auto;padding:10px 14px}.cm{margin-bottom:10px;font-size:14px}.cm b{margin-right:6px}
.list{flex:1;overflow-y:auto;padding:10px}
.song{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.song b{display:block}.song small{color:var(--mut)}.song audio{width:100%;margin-top:6px}
.prof{flex:1;overflow-y:auto;padding:16px}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(45deg,#f09433,#e1306c,#833ab4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
.prof input,.prof textarea{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:16px system-ui;margin-bottom:8px}
.stats{display:flex;justify-content:space-around;text-align:center;margin:14px 0;color:var(--mut);font-size:13px}.stats b{display:block;font-size:20px;color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
.dot{background:#e11;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px}
#psheet{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:6}#psheet.on{display:flex}
#pcont input[type=text]{width:100%;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.row .av{width:42px;height:42px;font-size:18px;margin:0;flex:none}.row small{color:var(--mut);display:block}
#toast{position:fixed;left:12px;right:12px;bottom:70px;background:#222;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;display:none;font-size:14px}
#ask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:21;display:none;align-items:center;justify-content:center}#ask.on{display:flex}
#ask div{background:var(--card);padding:18px;border-radius:14px;width:80%;text-align:center}#ask .btn{margin:10px 5px 0}
.ext{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;text-decoration:none;z-index:2}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.note{font-size:12px;color:var(--mut);text-align:center;padding:6px}
</style></head><body>
<div id="login"><h1 style="font-size:32px">Reels & Chat</h1><button class="btn" id="gl">Google bilan kirish</button><p id="lerr" style="color:#e11;font-size:14px"></p></div>
<header><h1>Reels & Chat</h1><span><button id="sb" class="chip">🔎 Odamlar</button> <span id="who"></span></span></header>
<main>
<section id="s-reels" class="on">
<div id="feed"></div>
<div class="bar" id="upbar"><input id="cap" type="text" placeholder="Izoh yoki YouTube/Instagram havolasi..."><button class="btn" id="lk" title="Havola qo'shish">🔗</button><label class="btn">🎬 Video<input id="file" type="file" accept="video/*" hidden></label></div>
</section>
<section id="s-chat">
<div id="chips" class="chips"></div>
<div id="msgs"></div>
<form id="f"><input id="t" type="text" placeholder="Xabar yozing..." autocomplete="off"><button class="btn">➤</button></form>
</section>
<section id="s-music"><div id="sl" class="list"></div><div class="bar" id="mbar"><input id="mt" type="text" placeholder="Qo'shiq nomi..."><label class="btn">🎵 MP3<input id="mfile" type="file" accept="audio/*,video/*" hidden></label></div></section>
<section id="s-prof"><div class="prof"><div class="av" id="av"></div><input id="pn" type="text" maxlength="30" placeholder="Ismingiz"><textarea id="pb" rows="2" maxlength="120" placeholder="Bio..."></textarea><button class="btn" id="ps" style="width:100%">Saqlash</button><div id="pst"></div></div></section>
<div id="psheet"><div class="sh"><div class="shh"><b>Odamlar</b><button id="px">✕</button></div><div id="pcont" style="flex:1;overflow-y:auto;padding:12px"></div></div></div>
<div id="sheet"><div class="sh"><div class="shh"><b>Izohlar</b><button id="cx">✕</button></div><div id="cl"></div><form id="cf"><input id="ct" type="text" placeholder="Izoh yozing..." autocomplete="off"><button class="btn">➤</button></form></div></div>
</main>
<nav><button id="n1" class="on">🎬 Reels</button><button id="n2">💬 Chat<span id="nb"></span></button><button id="n3">🎵 Musiqa</button><button id="n4">👤 Profil</button></nav>
<script>
const $=id=>document.getElementById(id);
let _tt;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',4000)}
function ask(m){return new Promise(r=>{$('aq').textContent=m;$('ask').classList.add('on');const f=v=>{$('ask').classList.remove('on');r(v)};$('ay').onclick=()=>f(true);$('an').onclick=()=>f(false)})}
let contacts=[],songs=[],unread={},lr={},watching={},prof={},msgPath='messages',unM=null,users=[],target='all',unC=null,cReel=null,db=null,assets=null,me={id:'guest',name:'Mehmon'},reels=[],likes={};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
function tab(n){['reels','chat','music','prof'].forEach((k,i)=>{$('s-'+k).classList.toggle('on',n==i+1);$('n'+(i+1)).classList.toggle('on',n==i+1)});
 if(n==2){const m=$('msgs');m.scrollTop=m.scrollHeight;markRead(target)}else if(n==1)pv();else document.querySelectorAll('.reel video').forEach(v=>v.pause());
 if(n==4)drawProf()}
[1,2,3,4].forEach(k=>$('n'+k).onclick=()=>tab(k));
function pv(){document.querySelectorAll('.reel video').forEach(v=>{const r=v.getBoundingClientRect(),h=$('feed').getBoundingClientRect();
 const vis=r.top>=h.top-h.height/2&&r.top<h.top+h.height/2;if(vis&&$('s-reels').classList.contains('on'))v.play().catch(()=>{});else v.pause()})}
$('feed').addEventListener('scroll',()=>{clearTimeout(window._p);window._p=setTimeout(pv,120)});
function drawReels(){
 const f=$('feed');
 if(!reels.length){f.innerHTML='<div class="empty">Hali reels yo\'q.<br>Pastdan birinchi videoni yuklang! 🎬</div>';return}
 f.innerHTML='';
 reels.forEach(r=>{const d=document.createElement('div');d.className='reel';
  d.innerHTML=(r.kind?embed(r):'<video src="'+esc(r.url)+'" loop playsinline muted></video>')+'<div class="cap"><b>@'+esc(r.name||'user')+'</b>'+esc(r.cap||'')+'</div><div class="side"><button class="lk">❤️</button><span>'+(r.likes||0)+'</span><button class="cmb">💬</button>'+(r.uid===me.id?'<button class="del">🗑</button>':'')+'</div>';
  const v=d.querySelector('video');if(v)v.onclick=()=>{v.muted=false;v.paused?v.play():v.pause()};
  d.querySelector('.cmb').onclick=()=>openC(r.id);const dl=d.querySelector('.del');if(dl)dl.onclick=async()=>{if(await ask('Videoni o\'chirasizmi?')){db.collection('reels').doc(r.id).delete().catch(()=>toast('O\'chirib bo\'lmadi'));delAsset(r.kind?'':r.url)}};d.querySelector('.lk').onclick=()=>{if(db)db.collection('reels').doc(r.id).update({likes:(r.likes||0)+1}).catch(()=>{})};
  f.appendChild(d)});
 setTimeout(pv,100)}
function drawMsgs(list){
 const m=$('msgs'),near=m.scrollHeight-m.scrollTop-m.clientHeight<80;
 m.innerHTML=list.length?'':'<div class="empty">Suhbatni boshlang 👋</div>';
 list.forEach(x=>{const d=document.createElement('div');d.className='m'+(x.uid===me.id?' me':'');
  d.innerHTML='<small>'+esc(x.name||'user')+'</small>'+esc(x.text);m.appendChild(d)});
 if(near)m.scrollTop=m.scrollHeight}
$('f').onsubmit=e=>{e.preventDefault();const t=$('t').value.trim();if(!t||!db)return;
 $('t').value='';const id='m'+Date.now()+Math.random().toString(36).slice(2,6);
 (msgPath?db.collection(msgPath):db.collection('messages')).doc(id).set({text:t.slice(0,500),uid:me.id,name:me.name,t:Date.now()}).catch(()=>toast('Yuborib bo\'lmadi'))};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f||!assets||!db)return;
 if(f.size>50*1048576){toast('Video 50 MB dan kichik bo\'lsin');return}
 const b=$('upbar').querySelector('label');b.firstChild.textContent='⏳ ';
 try{const a=await assets.upload(f);const id='r'+Date.now();
  await db.collection('reels').doc(id).set({url:a.url,cap:$('cap').value.slice(0,150),uid:me.id,name:me.name,likes:0,t:Date.now()});$('cap').value=''}
 catch(err){toast('Yuklashda xato: '+(err&&err.message||err))}
 b.firstChild.textContent='🎬 Video';e.target.value=''};
try{lr=JSON.parse(localStorage.getItem('lr')||'{}')}catch(e){}
function nb(){const n=Object.values(unread).reduce((a,b)=>a+b,0);$('nb').innerHTML=n?'<span class="dot">'+n+'</span>':''}
function markRead(id){lr[id]=Date.now();try{localStorage.setItem('lr',JSON.stringify(lr))}catch(e){}unread[id]=0;chips();nb()}
function watch(id){if(watching[id]||!db)return;watching[id]=1;
 const path=id==='all'?'messages':'dm/'+[me.id,id].sort().join('__')+'/msgs';
 db.collection(path).orderBy('t','desc').limit(30).onSnapshot(s=>{
  unread[id]=s.docs.filter(d=>{const x=d.data();return x.t>(lr[id]||0)&&x.uid!==me.id}).length;
  if(target===id&&$('s-chat').classList.contains('on'))markRead(id);else{chips();nb()}},()=>{})}
function drawSongs(){const l=$('sl');if(!songs.length){l.innerHTML='<div class="empty">Hali qo\'shiq yo\'q 🎵</div>';return}
 l.innerHTML='';songs.forEach(x=>{const d=document.createElement('div');d.className='song';
  d.innerHTML='<b>🎵 '+esc(x.title||'Nomsiz')+'</b><small>@'+esc(x.name||'user')+'</small>'+(x.uid===me.id?'<button class="sdel" style="float:right;background:none;border:0;font-size:18px">🗑</button>':'')+'<div class="pl"></div>';
  const pl=d.querySelector('.pl'),btn=document.createElement('button');btn.className='btn';btn.style.marginTop='8px';btn.textContent='▶ Eshitish';
  btn.onclick=async()=>{if(x.url){const a=document.createElement('audio');a.controls=true;a.style.cssText='width:100%;margin-top:8px';a.src=x.url;a.onplay=()=>{stopCur&&stopCur!==a._s&&stopCur();stopCur=a._s=()=>a.pause()};pl.innerHTML='';pl.appendChild(a);a.play().catch(()=>{});return}btn.textContent='⏳ Yuklanmoqda...';let bytes;
   try{bytes=await songBytes(x)}catch(er){btn.textContent='▶ Qayta urinish';toast('Yuklab bo\'lmadi: '+(er&&(er.code||er.message)||er));return}
   const web=async why=>{try{toast('Zaxira pleyer ishlatilmoqda ('+why+')');await mkWeb(x,bytes,pl)}catch(er){btn.textContent='▶ Qayta urinish';pl.innerHTML='';pl.appendChild(btn);toast('Bu fayl ijro etilmaydi: '+(er&&(er.message||er.name)||'format xato')+'. M4A yoki MP3 (boshqa kodek) bilan urinib ko\'ring')}};
   mkAudio(x,bytes,pl,web)};
  pl.appendChild(btn);
  const sd=d.querySelector('.sdel');if(sd)sd.onclick=async()=>{if(!await ask('Qo\'shiqni o\'chirasizmi?'))return;
   try{if(x.n){for(let i=0;i<x.n;i++)await db.collection('songs').doc(x.id).collection('chunks').doc('c'+String(i).padStart(4,'0')).delete()}await db.collection('songs').doc(x.id).delete();delAsset(x.url)}catch(er){toast('O\'chirib bo\'lmadi')}};
  l.appendChild(d)})}
const b64=u8=>{let r='';for(let i=0;i<u8.length;i+=0x8000)r+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(r)};
const CH=110000,cache={};
$('mfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!db)return;
 return upVid(f);
 if(f.size>8*1048576){toast('Fayl 8 MB dan kichik bo\'lsin');return}
 const lb=$('mbar').querySelector('label'),n=Math.ceil(f.size/CH),id='s'+Date.now()+Math.random().toString(36).slice(2,5);
 try{const buf=new Uint8Array(await f.arrayBuffer());
  for(let i=0;i<n;i+=2){await Promise.all([0,1].filter(k=>i+k<n).map(k=>db.collection('songs').doc(id).collection('chunks').doc('c'+String(i+k).padStart(4,'0')).set({i:i+k,d:b64(buf.subarray((i+k)*CH,(i+k+1)*CH))})));
   lb.firstChild.textContent='⏳ '+Math.round(Math.min(i+2,n)/n*100)+'% '}
  await db.collection('songs').doc(id).set({title:($('mt').value||f.name.replace(/\.[^.]+$/,'')).slice(0,80),mime:f.type||'audio/mpeg',n,size:f.size,uid:me.id,name:me.name,t:Date.now()});$('mt').value='';toast('Yuklandi ✓')}
 catch(err){toast('Yuklashda xato: '+(err&&(err.code||err.message)||err))}
 lb.firstChild.textContent='🎵 MP3 '};
async function upVid(f){if(!assets){toast('Video fayldan qo\'shiq yuklash faqat sayt egasi uchun');return}
 if(f.size>50*1048576){toast('Fayl 50 MB dan kichik bo\'lsin');return}
 const lb=$('mbar').querySelector('label');lb.firstChild.textContent='⏳ ';
 try{const a=await assets.upload(f,{type:f.type});
  await db.collection('songs').doc('s'+Date.now()).set({title:($('mt').value||f.name.replace(/\.[^.]+$/,'')).slice(0,80),url:a.url,uid:me.id,name:me.name,t:Date.now()});$('mt').value='';toast('Yuklandi ✓')}
 catch(err){toast('Yuklashda xato: '+(err&&(err.code||err.message)||err))}
 lb.firstChild.textContent='🎵 MP3 '}
const bcache={};let stopCur=null;
async function songBytes(x){if(bcache[x.id])return bcache[x.id];
 if(x.url){const r=await fetch(x.url);return bcache[x.id]=new Uint8Array(await r.arrayBuffer())}
 const s=await db.collection('songs').doc(x.id).collection('chunks').orderBy('i','asc').get();
 if(s.size<(x.n||1))throw{message:'bo\'laklar to\'liq emas ('+s.size+'/'+x.n+')'};
 const parts=s.docs.map(d=>Uint8Array.from(atob(d.data().d),c=>c.charCodeAt(0)));
 const out=new Uint8Array(parts.reduce((a,p)=>a+p.length,0));let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length});return bcache[x.id]=out}
function mkAudio(x,bytes,pl,onFail){const a=document.createElement('audio');a.controls=true;a.style.cssText='width:100%;margin-top:8px';
 a.src=URL.createObjectURL(new Blob([bytes],{type:x.mime||'audio/mpeg'}));let ok=false;
 a.onloadedmetadata=()=>ok=true;a.onerror=()=>onFail('audio');setTimeout(()=>{if(!ok&&!a.error)onFail('timeout')},4000);
 a.onplay=()=>{stopCur&&stopCur!==a._stop&&stopCur();stopCur=a._stop=()=>a.pause()};
 pl.innerHTML='';pl.appendChild(a);a.play().catch(()=>{});return a}
async function mkWeb(x,bytes,pl){const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();
 const buf=await new Promise((ok,no)=>ctx.decodeAudioData(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength),ok,no));
 pl.innerHTML='<div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn" style="padding:8px 14px">▶</button><input type="range" min="0" max="1000" value="0" style="flex:1"></div>';
 const bt=pl.querySelector('button'),rg=pl.querySelector('input');let src=null,off=0,t0=0,pl_=false,tm=null;
 const cur=()=>pl_?Math.min(ctx.currentTime-t0,buf.duration):off;
 const stop=()=>{if(src){src.onended=null;try{src.stop()}catch(e){}src=null}if(pl_){off=cur();pl_=false}bt.textContent='▶';clearInterval(tm)};
 const start=()=>{stopCur&&stopCur!==stop&&stopCur();stopCur=stop;ctx.resume();src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
  src.onended=()=>{stop();off=0;rg.value=0};src.start(0,off);t0=ctx.currentTime-off;pl_=true;bt.textContent='⏸';tm=setInterval(()=>rg.value=cur()/buf.duration*1000,300)};
 bt.onclick=()=>pl_?stop():start();
 rg.oninput=()=>{const w=pl_;stop();off=rg.value/1000*buf.duration;if(w)start()};start()}
function drawProf(){$('av').textContent=(me.name||'?')[0].toUpperCase();
 const mine=reels.filter(r=>r.uid===me.id&&!r.kind);
 $('pst').innerHTML='<div class="stats"><div><b>'+mine.length+'</b>Reels</div><div><b>'+songs.filter(x=>x.uid===me.id).length+'</b>Qo\'shiq</div><div><b>'+(users.length||1)+'</b>Foydalanuvchi</div></div><div class="grid">'+mine.map(r=>'<video src="'+esc(r.url)+'" muted playsinline preload="metadata"></video>').join('')+'</div>'}
$('ps').onclick=async()=>{const n=$('pn').value.trim().slice(0,30)||me.name;me.name=n;$('who').textContent=n;
 try{await db.collection('users').doc(me.id).set({name:n,bio:$('pb').value.slice(0,120),t:Date.now()});$('ps').textContent='✓ Saqlandi';setTimeout(()=>$('ps').textContent='Saqlash',1500)}catch(e){toast('Saqlab bo\'lmadi')}drawProf()};
function delAsset(u){if(u&&assets)assets.delete(u).catch(()=>{})}
const ini=n=>(n||'?')[0].toUpperCase();
$('sb').onclick=()=>{$('psheet').classList.add('on');peopleView()};
$('px').onclick=()=>$('psheet').classList.remove('on');
$('psheet').onclick=e=>{if(e.target.id==='psheet')$('psheet').classList.remove('on')};
function peopleView(){const c=$('pcont');
 c.innerHTML='<input id="pq" type="text" placeholder="Ism bo\'yicha qidirish..."><div id="pl"></div><button class="btn" id="inv" style="width:100%;margin-top:12px">📨 Do\'stni taklif qilish</button>';
 const L=q=>{const l=$('pl');const a=users.filter(u=>u.id!==me.id&&u.name.toLowerCase().includes(q.toLowerCase()));

function parseLink(u){u=(u||'').trim();let m;
 if(m=/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/.exec(u))return{kind:'yt',ext:m[1]};

 return '<iframe src="'+esc(src)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="width:100%;height:100%;border:0"></iframe><a class="ext" href="'+esc(href)+'" target="_blank" rel="noopener">↗ Ochish</a>'}

$('cx').onclick=$('sheet').onclick=e=>{if(e.target.id==='cx'||e.target.id==='sheet'){$('sheet').classList.remove('on');unC&&unC();unC=null}};

 add('all','🌍 Umumiy');users.filter(u=>u.id!==me.id).sort((a,b)=>contacts.includes(b.id)-contacts.includes(a.id)).forEach(u=>add(u.id,(contacts.includes(u.id)?'⭐ ':'👤 ')+u.name))}
function pick(id){target=id;msgPath=id==='all'?'messages':'dm/'+[me.id,id].sort().join('__')+'/msgs';chips();
 unM&&unM();unM=db.collection(msgPath).orderBy('t','asc').limit(200).onSnapshot(s=>drawMsgs(s.docs.map(d=>d.data())),()=>{});
 $('t').placeholder=id==='all'?'Xabar yozing...':'Shaxsiy xabar...'}

 if(!assets){const l=$('upbar').querySelector('label');l&&l.remove()}

 if(!db){$('feed').innerHTML='<div class="empty">Ma\'lumotlar bazasi mavjud emas. Tizimga kiring.</div>';return}
 drawReels();
 db.collection('reels').orderBy('t','desc').limit(30).onSnapshot(s=>{reels=s.docs.map(d=>({id:d.id,...d.data()}));drawReels();if($('s-prof').classList.contains('on'))drawProf()},()=>{});
 if(me.id!=='guest'){try{const d=await db.collection('users').doc(me.id).get();if(d.exists){prof=d.data();me.name=prof.name||me.name;$('who').textContent=me.name}else await db.collection('users').doc(me.id).set({name:me.name,t:Date.now()})}catch(e){}}

 db.collection('songs').orderBy('t','desc').limit(50).onSnapshot(s=>{songs=s.docs.map(d=>({id:d.id,...d.data()}));drawSongs()},()=>{});
 db.collection('users').limit(100).onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,name:d.data().name||'User '+d.id.slice(0,4),bio:d.data().bio||''}));users.forEach(u=>u.id!==me.id&&watch(u.id));chips()},()=>{});
 pick('all');
};
